---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 4.1.19)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write  # required for cosign keyless signing

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: app-wardrowbe
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading 'v' from tag
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  prepare-matrix:
    name: Prepare build matrix
    needs: version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare multi-arch matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, prepare-matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          context: wardrowbe
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          version: ${{ needs.version.outputs.version }}
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    name: Publish multi-arch manifest
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
